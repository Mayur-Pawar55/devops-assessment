name: Nexgensis CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexgensis-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/nexgensis-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexgensis-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/nexgensis-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd devops-assessment
            docker pull ${{ secrets.DOCKER_USERNAME }}/nexgensis-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/nexgensis-frontend:latest
            docker-compose down --remove-orphans
            docker-compose up -d
